# Unsigned builds unless signing credentials are provided (CSC_LINK / APPLE_ID … for macOS, CSC_LINK for Windows).
appId: com.schrrobe.gitspynx
productName: gitspynx
copyright: Copyright © Robert
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  # native module: pty.node and the macOS spawn-helper must be real files
  - node_modules/node-pty/**
npmRebuild: false # node-pty ships N-API prebuilds (built from source on Linux by npm ci)
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: [nsis]
nsis:
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target: [AppImage, deb]
  maintainer: Robert <robsch@stagedates.com>
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
