name: Package
# Builds installers on all three platforms and smoke-tests the packaged app (graph, terminal,
# password prompt). Signing uses repository secrets when they exist (see README "Signieren"):
# without them macOS builds are signed ad-hoc and Windows builds stay unsigned.
# A pushed tag v* also uploads the installers to a draft GitHub release (publish it by hand).
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            exe: dist/mac-universal/gitspynx.app/Contents/MacOS/gitspynx
          - os: windows-latest
            exe: dist/win-unpacked/gitspynx.exe
          - os: ubuntu-latest
            exe: dist/linux-unpacked/gitspynx
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # draft release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # certificate per platform (empty when the secret does not exist)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing instead of a certificate file
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
      - name: Check the macOS signature (a broken one makes macOS call the app "damaged")
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/mac-universal/gitspynx.app
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/smoke.cjs ${{ matrix.exe }}
      - name: Smoke test
        if: runner.os != 'Linux'
        run: node tools/smoke.cjs ${{ matrix.exe }}
      - name: Smoke test of the Intel half (Rosetta)
        if: runner.os == 'macOS'
        run: |
          printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$PWD/${{ matrix.exe }}" > x64.sh && chmod +x x64.sh
          node tools/smoke.cjs ./x64.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitspynx-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            smoke-failure.png
          if-no-files-found: ignore
