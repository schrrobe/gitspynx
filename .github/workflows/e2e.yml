name: E2E
# Drives the built app with Playwright (e2e/scenarios) on all three platforms.
on:
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run scenarios (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - name: Run scenarios
        if: runner.os != 'Linux'
        run: npm run e2e
